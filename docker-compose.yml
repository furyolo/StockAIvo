services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stock
      POSTGRES_USER: stockaivo
      POSTGRES_PASSWORD: StockAIvo_2025#Secure!
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockaivo -d stock"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:8.2.1-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 后端 API 服务
  backend:
    build: .
    ports:
      - "3224:3224"
    environment:
      - DATABASE_URL=postgresql://stockaivo:StockAIvo_2025#Secure!@postgres:5432/stock
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_DEFAULT_MODEL=${AI_DEFAULT_MODEL:-gemini-2.5-flash}
      - AI_TECHNICAL_ANALYSIS_MODEL=${AI_TECHNICAL_ANALYSIS_MODEL:-gemini-2.5-pro}
      - AI_SYNTHESIS_MODEL=${AI_SYNTHESIS_MODEL:-gemini-2.5-pro}
      - RUN_DATABASE_MIGRATIONS=${RUN_DATABASE_MIGRATIONS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test:
        - "CMD-SHELL"
        - "if [ ! -f /tmp/.healthcheck_done ]; then curl -f http://localhost:3224/health && touch /tmp/.healthcheck_done; else exit 0; fi"
      interval: 24h
      timeout: 10s
      retries: 1

  # 前端 Web 服务
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3223:80"
    depends_on:
      - backend
    volumes:
      - ./logs/nginx:/var/log/nginx

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: stockaivo-network
